apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: {{ .Values.namespace }}
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      aws:
        s3: s3://{{ .Values.loki.s3.endpoint }}/{{ .Values.loki.s3.bucket }}
        region: {{ .Values.loki.s3.region }}
        s3forcepathstyle: true

      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache
        shared_store: s3

    ingester:
      wal:
        enabled: true
        dir: /loki/wal
      chunk_idle_period: 1m
      max_chunk_age: 2m

    limits_config:
      retention_period: {{ .Values.loki.retention.default }}
      retention_stream:
{{- range .Values.loki.retention.priorityNamespaces }}
        - selector: '{namespace="{{ .name }}"}'
          priority: 1
          period: {{ .period }}
{{- end }}

    compactor:
      working_directory: /loki/compactor
      shared_store: s3
      retention_enabled: true
      compaction_interval: 5m
      retention_delete_delay: 30m
      delete_request_store: s3

    chunk_store_config:
      chunk_cache_config:
        embedded_cache:
          enabled: true
          max_size_mb: 512